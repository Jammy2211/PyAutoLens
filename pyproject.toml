[build-system]
requires = ["setuptools>=79.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autolens"
dynamic = ["version"]
description="Open-Source Strong Lensing"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "James Nightingale", email = "James.Nightingale@newcastle.ac.uk" },
    { name = "Richard Hayes", email = "richard@rghsoftware.co.uk" },
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
keywords = ["cli"]
dependencies = [
    # Floor, not a pin. Without one, pip backtracking the extras chain
    # (autolens[jax] -> autogalaxy[jax] -> autofit[jax] -> autonerves[jax]) may
    # walk the release history to 2022: "version X does not provide the extra
    # 'jax'" is a pip *warning*, not an error, so a pre-extras release is a
    # legal solution. That is how `autolens[optional]` came to install autofit
    # 2026.4.30.582 and fail on `af.Latent` (#687).
    "autogalaxy>=2026.7.29.2",
    "nautilus-sampler==1.0.5"
]

[project.urls]
Homepage = "https://github.com/PyAutoLabs/PyAutoLens"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["docs", "test_autolens", "test_autolens*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"


[project.optional-dependencies]
jax = ["autogalaxy[jax]>=2026.7.29.2"]
coolest = ["coolest"]
optional = [
    "autolens[jax]",
    "coolest",
    "numba",
    "pynufft",
    "zeus-mcmc==2.5.4",
    "getdist==1.4"
]
docs=[
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx_copybutton",
    "sphinx_design",
    "sphinx_inline_tabs",
    "sphinx_autodoc_typehints"
]
test = ["pytest", "coolest"]
dev = ["pytest", "black", "coolest"]

[tool.setuptools.package-data]
"autolens.config" = ["*"]

[tool.pytest.ini_options]
testpaths = ["test_autolens"]
filterwarnings = [
    "ignore:cuda_plugin_extension:UserWarning",
    "ignore::DeprecationWarning:jax",
]
